services:
  - type: web
    name: sabeel-portfolio-api
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
        placeholder: "Enter your MongoDB Atlas Connection String"
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
